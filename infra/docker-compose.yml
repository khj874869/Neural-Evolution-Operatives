services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: neural_evolution
      POSTGRES_USER: neo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong value}
    volumes:
      - neo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neo -d neural_evolution"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD to a strong value}
    command: >-
      sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - neo_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  game-server:
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 2567
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 characters}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the internal PostgreSQL URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the authenticated internal Redis URL}
      RELEASE_CHANNEL: ${RELEASE_CHANNEL:-alpha}
      COMMIT_SHA: ${COMMIT_SHA:-unknown}
      OPS_ADMIN_TOKEN: ${OPS_ADMIN_TOKEN:-}
    ports:
      - "2567:2567"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2567/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
    restart: unless-stopped

volumes:
  neo_postgres:
  neo_redis:
