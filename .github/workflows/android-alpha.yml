name: Android Private Alpha

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: HTTPS game server URL embedded in the alpha client
        required: true
        type: string
      feedback_url:
        description: Optional HTTPS feedback form URL
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-alpha:
    runs-on: ubuntu-latest
    env:
      VITE_GAME_SERVER_URL: ${{ inputs.server_url }}
      VITE_FEEDBACK_URL: ${{ inputs.feedback_url }}
      VITE_RELEASE_CHANNEL: alpha
      VITE_ENABLE_COMMERCE: 'false'
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/neo-alpha-release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      - name: Validate release inputs and signing configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          function validateHttpsUrl(name, required) {
            const raw = process.env[name]?.trim() ?? '';
            if (!raw && !required) return;
            if (!raw) throw new Error(`${name} is required`);
            const url = new URL(raw);
            if (url.protocol !== 'https:') throw new Error(`${name} must use HTTPS`);
            if (url.username || url.password) throw new Error(`${name} must not contain credentials`);
          }

          validateHttpsUrl('VITE_GAME_SERVER_URL', true);
          validateHttpsUrl('VITE_FEEDBACK_URL', false);
          NODE

          signing_secret_count=0
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -n "${!secret_name}" ]; then
              signing_secret_count=$((signing_secret_count + 1))
            fi
          done

          if [ "$signing_secret_count" -ne 0 ] && [ "$signing_secret_count" -ne 4 ]; then
            echo "Configure all four Android signing secrets, or leave all four empty." >&2
            exit 1
          fi

          if [ "$signing_secret_count" -eq 4 ]; then
            echo "ANDROID_SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "ANDROID_SIGNED_RELEASE=false" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_VERSION_CODE=$((10300 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - run: npm run release:check
      - run: npm run check
      - run: npm run mobile:sync
      - run: npm run release:check -- --client-artifacts
      - name: Prepare optional release signing
        if: env.ANDROID_SIGNED_RELEASE == 'true'
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
      - name: Build alpha artifact
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew printAlphaSigningStatus
          if [ "$ANDROID_SIGNED_RELEASE" = "true" ]; then
            ./gradlew bundleRelease
          else
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: neural-operatives-alpha-${{ github.run_number }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
